version: '3.8'

services:
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: ibvap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ibvap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ibvap_secret}
      POSTGRES_DB: ${POSTGRES_DB:-ibvap_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ibvap}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ibvap-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ibvap-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6333/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: ibvap-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-create-bucket:
    image: minio/mc:latest
    container_name: ibvap-minio-create-bucket
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc config host add myminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      /usr/bin/mc mb myminio/${MINIO_BUCKET_ALERTS:-alerts} --ignore-existing;
      /usr/bin/mc anonymous set public myminio/${MINIO_BUCKET_ALERTS:-alerts};
      /usr/bin/mc mb myminio/ibvap-evidence --ignore-existing;
      /usr/bin/mc anonymous set public myminio/ibvap-evidence;
      exit 0;
      "

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: ibvap-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-ibvap}:${POSTGRES_PASSWORD:-ibvap_secret}@postgres:5432/${POSTGRES_DB:-ibvap_db}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/api:/app
      - ./alembic.ini:/app/alembic.ini
      - ./db:/app/db

volumes:
  pgdata:
  qdrant_data:
  minio_data:
